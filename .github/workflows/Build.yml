name: Build Telegram APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name"
        type: string
        default: master
      app-type:
        description: "App type"
        type: choice
        options:
          - ""
          - "AppRustore"
        default: ""
      release-type:
        description: "Release type"
        type: choice
        options:
          - Release
          - Debug
        default: Debug
      appidhash:
        description: "use another APP_ID/APP_HASH"
        type: boolean
        default: false

env:
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Configure jlatexmath Gradle module
        if: false
        run: |
          grep -qF "include ':jlatexmath'" settings.gradle || \
            echo "include ':jlatexmath'" >> settings.gradle

          grep -qF "project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')" settings.gradle || \
            echo "project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')" >> settings.gradle

      - name: Configure Gradle optimizations
        run: |
          sed -i \
            -e '/^org.gradle.caching=/d' \
            -e '/^org.gradle.configuration-cache=/d' \
            -e '/^org.gradle.configuration-cache.problems=/d' \
             gradle.properties

          printf "org.gradle.caching=true\n" >> gradle.properties
          printf "org.gradle.configuration-cache=true\n" >> gradle.properties
          printf "org.gradle.configuration-cache.problems=warn\n" >> gradle.properties

          echo "Gradle properties:"
          cat gradle.properties
          
      - name: Extract Android SDK versions
        id: sdk
        run: |
          BUILD_GRADLE=TMessagesProj_App/build.gradle

          echo "build_tools=$(grep -oP "buildToolsVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$(grep -oP "compileSdk(?:Version)?\s*=?\s*\K\d+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"
          echo "ndk=$(grep -oP "ndkVersion ['\"]\\K[^'\"]+" "$BUILD_GRADLE")" >> "$GITHUB_OUTPUT"
    
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            build-tools;${{ steps.sdk.outputs.build_tools }}
            ndk;${{ steps.sdk.outputs.ndk }}
            platforms;android-${{ steps.sdk.outputs.compile_sdk }}
            
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties

      - name: Fill BuildVars
        if: ${{ inputs.appidhash }}
        run: |
          sed -i -E 's/public static int APP_ID = [0-9]+;/public static int APP_ID = 6;/' \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

          sed -i -E 's/public static String APP_HASH = "[^"]*";/public static String APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e";/' \
            TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ steps.sdk.outputs.ndk }}

      - name: Cache native CMake / NDK build
        uses: actions/cache@v6
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/cmake
            TMessagesProj/build/intermediates/ndkBuild
          key: ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ndk-${{ steps.sdk.outputs.ndk }}-
            ${{ runner.os }}-ndk-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build APK
        run: |
          ./gradlew \
            :TMessagesProj_App${{ inputs.app-type }}:assembleAfat${{ inputs.release-type }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App${{ inputs.app-type }}/build/outputs/**/*.apk
          archive: false
