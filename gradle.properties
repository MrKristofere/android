# Copy this file to gradle.properties and fill in your values.
# gradle.properties is gitignored and must NOT be committed.

APP_VERSION_CODE=9999
APP_VERSION_NAME=12.10.1
APP_PACKAGE=uz.codingtech.messengerapp
IS_PRIVATE=false

# Release signing - fill these with your own keystore credentials
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android

org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
